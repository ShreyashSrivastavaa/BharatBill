version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bharatbill-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: bharatbill
      POSTGRES_PASSWORD: bharatbill_dev
      POSTGRES_DB: bharatbill
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bharatbill']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

