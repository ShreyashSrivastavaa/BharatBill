name: BharatBill CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Server & Client)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bharatbill
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bharatbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Run Database Migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://bharatbill:testpassword@localhost:5432/bharatbill_test?schema=public
        run: npx prisma migrate deploy --schema=../prisma/schema.prisma

      - name: Build Server (NestJS)
        working-directory: ./server
        run: npm run build

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Typecheck & Build Client (Vite + React)
        working-directory: ./client
        run: npm run build
